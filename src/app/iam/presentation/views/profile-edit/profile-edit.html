<section class="profile-page">
  <header class="page-head">
    <div>
      <p class="eyebrow">Perfil</p>
      <h1>Editar empresa</h1>
    </div>
  </header>

  <form class="profile-form" (ngSubmit)="save()">
    <label>
      Nombre de la empresa
      <input class="ft-input" name="companyName" [(ngModel)]="form.companyName" autocomplete="organization" />
    </label>
    <label>
      RUC
      <input class="ft-input" name="ruc" [(ngModel)]="form.ruc" inputmode="numeric" />
    </label>
    <label>
      Telefono
      <input class="ft-input" name="phone" [(ngModel)]="form.phone" inputmode="tel" autocomplete="tel" />
    </label>
    <label>
      Correo
      <input class="ft-input" name="email" [(ngModel)]="form.email" type="email" autocomplete="email" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" class="ft-btn primary" [disabled]="loading()">
        <mat-icon>save</mat-icon>
        {{ loading() ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  </form>
</section>
