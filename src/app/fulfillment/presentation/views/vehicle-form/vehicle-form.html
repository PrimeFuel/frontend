<div class="ft-page narrow">
  <div class="ft-page-header">
    <div>
      <h1 class="ft-page-title">{{ 'vehicle-form.title' | translate }}</h1>
      <p class="ft-page-subtitle">{{ 'vehicle-form.subtitle' | translate }}</p>
    </div>
  </div>

  <form class="ft-card" [formGroup]="vehicleForm" (ngSubmit)="onSubmit()">
    <div class="ft-field">
      <label class="ft-label">{{ 'vehicle-form.fields.license-plate' | translate }}</label>
      <input class="ft-input" formControlName="licensePlate" [placeholder]="'vehicle-form.placeholders.license-plate' | translate" />
      @if (vehicleForm.get('licensePlate')?.touched && vehicleForm.get('licensePlate')?.invalid) {
        <span class="ft-error">{{ getErrorMessage('licensePlate') }}</span>
      }
    </div>

    <div class="form-grid">
      <div class="ft-field">
        <label class="ft-label">{{ 'vehicle-form.fields.brand' | translate }}</label>
        <input class="ft-input" formControlName="brand" [placeholder]="'vehicle-form.placeholders.brand' | translate" />
      </div>
      <div class="ft-field">
        <label class="ft-label">{{ 'vehicle-form.fields.model' | translate }}</label>
        <input class="ft-input" formControlName="model" [placeholder]="'vehicle-form.placeholders.model' | translate" />
      </div>
    </div>

    <div class="form-grid">
      <div class="ft-field">
        <label class="ft-label">{{ 'vehicle-form.fields.capacity' | translate }}</label>
        <input class="ft-input" type="number" formControlName="capacity" [placeholder]="'vehicle-form.placeholders.capacity' | translate" />
      </div>
      <div class="ft-field">
        <label class="ft-label">{{ 'vehicle-form.fields.unit' | translate }}</label>
        <select class="ft-select" formControlName="unit">
          @for (u of units; track u.value) {
            <option [value]="u.value">{{ u.label | translate }}</option>
          }
        </select>
      </div>
    </div>

    <div class="ft-field">
      <label class="ft-label">{{ 'vehicle-list.fields.status' | translate }}</label>
      <select class="ft-select" formControlName="status">
        @for (s of statuses; track s) {
          <option [value]="s">{{ 'vehicle-status.' + s.toLowerCase() | translate }}</option>
        }
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="ft-btn outline" (click)="onCancel()">
        {{ 'common.actions.cancel' | translate }}
      </button>
      <button type="submit" class="ft-btn accent" [disabled]="vehicleForm.invalid">
        {{ (isEditMode ? 'common.actions.save' : 'vehicle-form.register') | translate }}
      </button>
    </div>
  </form>
</div>
